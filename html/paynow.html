<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - Payment</title>
 <link rel="icon" type="image/png" href="../images/S.png">
  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body{
     background: #0d1b2a!important; 
}
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #ff0000;
      color: white;
      padding-top: 100px;
    }

    .payment-section {
      width: 800px;
      margin: auto;
      background: #0a0a0a;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(150, 0, 255, 0.4);
      padding: 40px;
      text-align: center;
    }

    .payment-section h2 {
      color: #9b4dff;
      font-size: 1.8em;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: 500;
      text-align: left;
      color: #ccc;
    }

    input, select {
      padding: 12px;
      border: none;
      border-bottom: 2px solid #9b4dff;
      background: transparent;
      color: white;
      font-size: 1em;
      outline: none;
    }

    input::placeholder {
      color: #aaa;
    }

    .pay-btn {
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #7B2FF7, #F107A3);
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .pay-btn:hover {
      background: linear-gradient(135deg, #9b4dff, #6a00ff);
    }
  </style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <h2>Skill<span>Hub</span></h2>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="notes.html">Notes</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-btn">
        <a href="login.html" class="login-btn">Login</a>
        <a href="signup.html" class="signup-btn">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- ================= PAYMENT FORM ================= -->
  <section class="payment-section">
    <h2>Complete Your Notes Purchase</h2>
    <form id="paymentForm">
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email Address" required>

  <select id="paymentMethod" required>
    <option value="">Select Payment Method</option>
    <option value="paypal">PayPal</option>
    <option value="jazzcash">JazzCash</option>
    <option value="easypaisa">EasyPaisa</option>
  </select>

  <button type="submit" class="pay-btn">Proceed to Pay</button>
</form>

<script>
  const form = document.getElementById('paymentForm');

  form.addEventListener('submit', function (e) {
    e.preventDefault(); // stop page reload

    const method = document.getElementById('paymentMethod').value;

    if (method === "paypal") {
      window.location.href = "paypal.html";
    } else if (method === "jazzcash") {
      window.location.href = "js.html";
    } else if (method === "easypaisa") {
      window.location.href = "easy.html";
    } else {
      alert("Please select a payment method first!");
    }
  });
</script>

    <a href="help.html" class="help-btn">?</a>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2026 SkillHub. All Rights Reserved.</p>
  </footer>

</body>
</html>
