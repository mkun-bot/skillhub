 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - Chat Support</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #ff0000;
      color: white;
      padding-top: 100px;
    }

    .chat-section {
      width: 800px;
      margin: auto;
      background: #0a0a0a;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(150, 0, 255, 0.4);
      padding: 40px;
      text-align: center;
    }

    .chat-section h2 {
      color: #9b4dff;
      font-size: 2em;
      margin-bottom: 20px;
    }

    .chat-box {
      background: #111;
      border-radius: 12px;
      padding: 20px;
      height: 300px;
      overflow-y: auto;
      text-align: left;
      color: #ccc;
      margin-bottom: 20px;
    }

    .chat-input {
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background: #222;
      color: white;
      font-size: 1em;
      outline: none;
    }

    .chat-input button {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #7B2FF7, #F107A3);
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .chat-input button:hover {
      background: linear-gradient(135deg, #9b4dff, #6a00ff);
    }
  </style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <h2>Skill<span>Hub</span></h2>
      </div>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="notes.html">Notes</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="help.html">Help</a></li>
      </ul>
      <div class="nav-btn">
        <a href="login.html" class="login-btn">Login</a>
        <a href="signup.html" class="signup-btn">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- ================= CHAT SECTION ================= -->
  <section class="chat-section">
    <h2>Chat Support</h2>
    <div class="chat-box" id="chatBox">
      <p><strong>Support:</strong> Hi there! How can we help you today?</p>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2026 SkillHub. All Rights Reserved.</p>
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const message = input.value.trim();

      if (message !== "") {
        const userMsg = document.createElement('p');
        userMsg.innerHTML = `<strong>You:</strong> ${message}`;
        chatBox.appendChild(userMsg);
        input.value = "";

        // Auto reply simulation
        const reply = document.createElement('p');
        reply.innerHTML = `<strong>Support:</strong> Thanks for your message! We'll get back to you shortly.`;
        chatBox.appendChild(reply);

        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
