<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub - EasyPaisa Payment</title>
  <style>
    body{
     background: #0d1b2a!important; 
}
    body {
      font-family: 'Poppins', sans-serif;
      background: #ff0000;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    .box {
      width: 500px;
      margin: auto;
      background: #0a0a0a;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(150, 0, 255, 0.4);
      padding: 40px;
    }
    input {
      width: 80%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }
    button {
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #7B2FF7, #F107A3);
      color: white;
      font-size: 1em;
      cursor: pointer;
    }
    .success {
      color: #00ff88;
      display: none;
      margin-top: 20px;
    }
    .error {
      color: #ff4444;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>EasyPaisa Payment</h2>
    <p>Enter your EasyPaisa mobile number and OTP to confirm payment.</p>
    <input type="text" id="mobile" placeholder="03XX-XXXXXXX">
    <input type="text" id="otp" placeholder="Enter OTP">
    <button onclick="processPayment()">Confirm Payment</button>
    <p id="successMsg" class="success">✅ Payment Successful via EasyPaisa!</p>
    <p id="errorMsg" class="error">⚠️ Please enter your mobile number and OTP first.</p>
  </div>

  <script>
    function processPayment() {
      const mobile = document.getElementById('mobile').value.trim();
      const otp = document.getElementById('otp').value.trim();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');

      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      if (mobile === "" || otp === "") {
        errorMsg.style.display = 'block';
      } else {
        successMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
